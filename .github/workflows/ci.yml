name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4.2.0
        with:
          version: "latest"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format . --diff
      - run: uv run mypy fusetools

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v4.2.0
        with:
          version: "latest"
      - run: uv sync --group dev --group test
      - run: uv run pytest --disable-socket --allow-unix-socket tests/unit_tests/

  lockfile:
    name: actions lockfile
    runs-on: ubuntu-slim
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
