name: release
run-name: Release fusetools by @${{ github.actor }}

on:
  workflow_dispatch:
  workflow_call:

env:
  PYTHON_VERSION: "3.11"

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    outputs:
      pkg-name: ${{ steps.check-version.outputs.pkg-name }}
      version: ${{ steps.check-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --group dev --group test

      - name: Run lint
        run: uv run ruff check . && uv run ruff format . --diff && uv run mypy fusetools

      - name: Run tests
        run: uv run pytest --disable-socket --allow-unix-socket tests/unit_tests/

      - name: Build package
        run: uv build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: dist
          path: dist/

      - name: Check version
        id: check-version
        run: |
          set -eu
          PKG_NAME=$(grep -m1 '^name = ' pyproject.toml | cut -d'"' -f2)
          VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "pkg-name=${PKG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing — configure at https://pypi.org/manage/account/publishing/
      id-token: write

    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          verbose: true
          print-hash: true
          attestations: false

  mark-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4.3.0
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        uses: ncipollo/release-action@v1.16.0
        id: create-release
        with:
          artifacts: "dist/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          generateReleaseNotes: true
          tag: v${{ needs.build.outputs.version }}
          commit: master

      - name: Add release URL to summary
        run: |
          echo "GitHub Release: ${{ steps.create-release.outputs.html_url }}" >> $GITHUB_STEP_SUMMARY
